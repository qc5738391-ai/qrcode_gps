name: Android CI

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # 1. 自动解压上传的 ZIP 包
    - name: Unzip Source Code
      run: |
        if [ -f *.zip ]; then
          unzip -o *.zip
          # 如果解压后嵌套了一层同名文件夹，将其文件提取出来
          if [ -d "FieldQR_Collector_Android_Kotlin_Project" ]; then
            cp -rn FieldQR_Collector_Android_Kotlin_Project/* . || true
          fi
        fi

    # 2. 配置 Java 17 环境
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # 3. 配置 Gradle
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    # 4. 执行编译
    - name: Build Debug APK
      run: |
        chmod +x gradlew || true
        ./gradlew assembleDebug

    # 5. 上传生成的 APK 文件
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk

