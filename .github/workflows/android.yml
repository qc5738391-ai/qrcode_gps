name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip Source Code
        run: |
          # 寻找根目录中的 zip 文件并自动解压
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Unzipping $ZIP_FILE..."
            unzip -o "$ZIP_FILE" -d temp_unzip
            # 如果解压出来只有一层顶层目录，将其内部文件移动到当前根目录
            if [ $(ls -A temp_unzip | wc -l) -eq 1 ] && [ -d temp_unzip/* ]; then
              cp -r temp_unzip/*/* . || true
              cp -r temp_unzip/*/. . || true
            else
              cp -r temp_unzip/* . || true
            fi
            rm -rf temp_unzip
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Auto Generation and Fix Permissions for Gradle Wrapper
        run: |
          # 如果解压后的项目中缺失 gradlew 脚本，自动生成它
          if [ ! -f "gradlew" ]; then
            echo "gradlew not found, generating wrapper..."
            gradle wrapper
          fi
          # 赋予可执行权限
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
