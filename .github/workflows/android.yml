name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip Source Code & Fix Version Catalog
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Unzipping $ZIP_FILE..."
            unzip -o "$ZIP_FILE" -d temp_unzip

            # 寻找包含 settings.gradle(.kts) 的真正的项目根目录
            SETTINGS_FILE=$(find temp_unzip -name "settings.gradle*" | head -n 1)
            
            if [ -n "$SETTINGS_FILE" ]; then
              PROJECT_DIR=$(dirname "$SETTINGS_FILE")
              echo "Found Android Root Project at $PROJECT_DIR, moving files..."
              # 递归移动所有文件，包括隐藏文件与子文件夹
              cp -a $PROJECT_DIR/. . || true
            else
              echo "No settings.gradle found, moving top level contents..."
              cp -a temp_unzip/. . || true
            fi
            rm -rf temp_unzip
          fi

          # 检查并确保 gradle 文件夹及 libs.versions.toml 存在
          if [ ! -f "gradle/libs.versions.toml" ]; then
            echo "Warning: gradle/libs.versions.toml missing! Searching in subdirectories..."
            FOUND_TOML=$(find . -name "libs.versions.toml" | head -n 1)
            if [ -n "$FOUND_TOML" ]; then
              mkdir -p gradle
              cp "$FOUND_TOML" gradle/libs.versions.toml
              echo "Restored libs.versions.toml to gradle/"
            fi
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          else
            echo "gradlew missing, using system gradle 8.5..."
            gradle assembleDebug --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
