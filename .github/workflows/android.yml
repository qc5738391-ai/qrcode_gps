name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip Source Code
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Unzipping $ZIP_FILE..."
            unzip -o "$ZIP_FILE" -d temp_unzip
            
            TARGET_FILE=$(find temp_unzip -name "settings.gradle*" -o -name "build.gradle*" | head -n 1)
            if [ -n "$TARGET_FILE" ]; then
              PROJECT_DIR=$(dirname "$TARGET_FILE")
              echo "Moving files from $PROJECT_DIR..."
              cp -a $PROJECT_DIR/. . || true
            else
              cp -a temp_unzip/. . || true
            fi
            rm -rf temp_unzip
          fi

      - name: Fix Kotlin Code Syntax Errors
        run: |
          SCAN_FILE=$(find . -name "ScanFragment.kt" | head -n 1)
          if [ -n "$SCAN_FILE" ]; then
            echo "Found $SCAN_FILE, checking line 140-145..."
            # 自动修复常见尾部多余逗号或未闭合问题
            sed -i '140,145s/,\s*)/)/g' "$SCAN_FILE" || true
            sed -i '140,145s/,\s*]/]/g' "$SCAN_FILE" || true
          fi

      - name: Fix Version Catalog & Settings
        run: |
          mkdir -p gradle
          printf '[versions]\nagp = "8.2.2"\nkotlin = "1.9.22"\nksp = "1.9.22-1.0.17"\n\n[plugins]\nandroid-application = { id = "com.android.application", version.ref = "agp" }\nkotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }\nksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }\n' > gradle/libs.versions.toml

          if [ ! -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ]; then
            printf 'pluginManagement {\n    repositories {\n        google()\n        mavenCentral()\n        gradlePluginPortal()\n    }\n}\ndependencyResolutionManagement {\n    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)\n    repositories {\n        google()\n        mavenCentral()\n        gradlePluginPortal()\n    }\n}\nrootProject.name = "qrcode_gps"\ninclude(":app")\n' > settings.gradle.kts
          fi

      - name: Create Missing App Icons
        run: |
          RES_DIR=$(find . -maxdepth 5 -type d -path "*/src/main/res" | head -n 1)
          if [ -z "$RES_DIR" ]; then
            RES_DIR="app/src/main/res"
          fi
          
          MIPMAP_DIR="$RES_DIR/mipmap-anydpi-v26"
          mkdir -p "$MIPMAP_DIR"

          ICON_XML='<?xml version="1.0" encoding="utf-8"?><adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@android:color/white"/><foreground android:drawable="@android:color/black"/></adaptive-icon>'

          if [ ! -f "$MIPMAP_DIR/ic_launcher.xml" ]; then
            echo "$ICON_XML" > "$MIPMAP_DIR/ic_launcher.xml"
          fi
          if [ ! -f "$MIPMAP_DIR/ic_launcher_round.xml" ]; then
            echo "$ICON_XML" > "$MIPMAP_DIR/ic_launcher_round.xml"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Compatible Gradle 8.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build Debug APK
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
