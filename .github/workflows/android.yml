name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip Source Code
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Unzipping $ZIP_FILE..."
            unzip -o "$ZIP_FILE" -d temp_unzip

            SETTINGS_FILE=$(find temp_unzip -name "settings.gradle*" | head -n 1)
            if [ -n "$SETTINGS_FILE" ]; then
              PROJECT_DIR=$(dirname "$SETTINGS_FILE")
              echo "Found Android Root Project at $PROJECT_DIR, moving files..."
              cp -a $PROJECT_DIR/. . || true
            else
              echo "No settings.gradle found, moving top level contents..."
              cp -a temp_unzip/. . || true
            fi
            rm -rf temp_unzip
          fi

      - name: Auto Generate Version Catalog
        run: |
          if [ ! -f "gradle/libs.versions.toml" ]; then
            echo "gradle/libs.versions.toml missing, creating default catalog..."
            mkdir -p gradle
            echo '[versions]' > gradle/libs.versions.toml
            echo 'agp = "8.2.2"' >> gradle/libs.versions.toml
            echo 'kotlin = "1.9.22"' >> gradle/libs.versions.toml
            echo 'ksp = "1.9.22-1.0.17"' >> gradle/libs.versions.toml
            echo '' >> gradle/libs.versions.toml
            echo '[plugins]' >> gradle/libs.versions.toml
            echo 'android-application = { id = "com.android.application", version.ref = "agp" }' >> gradle/libs.versions.toml
            echo 'kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }' >> gradle/libs.versions.toml
            echo 'ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }' >> gradle/libs.versions.toml
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          else
            echo "gradlew missing, using system gradle 8.5..."
            gradle assembleDebug --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
