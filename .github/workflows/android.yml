name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip Source Code
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Unzipping $ZIP_FILE..."
            unzip -o "$ZIP_FILE" -d temp_unzip

            # 寻找包含 settings.gradle 或 settings.gradle.kts 的真正项目根目录
            SETTINGS_FILE=$(find temp_unzip -name "settings.gradle*" | head -n 1)
            
            if [ -n "$SETTINGS_FILE" ]; then
              PROJECT_DIR=$(dirname "$SETTINGS_FILE")
              echo "Found Android Root Project at $PROJECT_DIR, moving files..."
              # 使用 rsync 或 cp 完整复制包括隐藏文件和所有子目录
              cp -a $PROJECT_DIR/. . || true
            else
              echo "No settings.gradle found, moving top level contents..."
              cp -a temp_unzip/. . || true
            fi
            
            rm -rf temp_unzip
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        run: |
          # 优先尝试使用项目自带的 gradlew
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          else
            echo "gradlew missing, using system gradle 8.5..."
            gradle assembleDebug --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
