name: Android CI

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # 1. 自动解压 ZIP 并把所有文件平铺提取到根目录
    - name: Unzip Source Code
      run: |
        if ls *.zip 1> /dev/null 2>&1; then
          echo "Unzipping file..."
          unzip -o *.zip
          # 寻找 gradlew 所在的路径并将所有文件移至当前根目录
          GRADLEW_PATH=$(find . -maxdepth 3 -name "gradlew" | head -n 1)
          if [ -n "$GRADLEW_PATH" ]; then
            PROJECT_DIR=$(dirname "$GRADLEW_PATH")
            if [ "$PROJECT_DIR" != "." ]; then
              echo "Moving files from $PROJECT_DIR to root..."
              cp -r $PROJECT_DIR/* . || true
            fi
          fi
        fi

    # 2. 配置 Java 17 环境
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # 3. 配置 Gradle
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    # 4. 执行编译
    - name: Build Debug APK
      run: |
        chmod +x gradlew || true
        ./gradlew assembleDebug

    # 5. 上传生成的 APK 文件
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
